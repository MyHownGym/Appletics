    <!-- Schema.org — FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Comment inviter mes athlètes sur Appletics ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Une fois votre profil coach créé, rendez-vous dans la section Athlètes et appuyez sur Inviter. Vous pouvez envoyer un lien d'invitation par message ou e-mail. Vos athlètes créent leur compte gratuitement en moins de 2 minutes."
          }
        },
        {
          "@type": "Question",
          "name": "Quelle est la différence entre Basic, Pro et Elite ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Toutes les formules coachs et clubs Basic, Pro et Elite incluent 30 jours d'essai gratuit. Coach Basic (CHF 5.90/mois) comprend 5 fiches athlètes, 3 plans, 5 compétitions et 1 groupe de discussion. Coach Pro (CHF 9.90/mois) comprend 25 fiches athlètes, 15 plans, 20 compétitions, 5 groupes et les graphiques individuels. Coach Elite (CHF 19.90/mois) offre des capacités illimitées, les comparaisons de saisons, les analyses d'équipe et les exports PDF. Club Basic comprend 2 coachs et 50 fiches athlètes, Club Pro 150 fiches athlètes et Club Elite 15 coachs et 500 fiches athlètes. Calendrier, séances, records personnels et historique sont inclus dans toutes les formules. Les quotas sont partagés au niveau du compte ou du club, archives comprises. Les prix mensuels sont sans engagement ; les options sur 12 mois et en paiement annuel unique figurent dans les tarifs."
          }
        },
        {
          "@type": "Question",
          "name": "Les données sont-elles hébergées en Suisse ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Toutes les données sont hébergées sur des serveurs en Suisse, en conformité avec la nLPD (nouvelle Loi fédérale sur la protection des données)."
          }
        },
        {
          "@type": "Question",
          "name": "Quand Appletics sera-t-elle disponible sur iOS et Android ?",
          "acceptedAnswer": {

            "text": "Appletics est en développement actif. La sortie est prévue pour la saison indoor (novembre 2026 – janvier 2027)."
          }
        }
      ]
